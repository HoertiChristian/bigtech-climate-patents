[project]
name = "bigtech-climate-patents"
version = "0.1.0"
description = "Patent landscape analysis of Big Tech climate and energy innovation"
requires-python = ">=3.11"
dependencies = [
    "bertopic>=0.16",
    "sentence-transformers>=3.0",
    "requests>=2.31",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
